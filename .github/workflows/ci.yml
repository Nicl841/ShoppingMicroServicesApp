# .github/workflows/api-ci.yml
name: API Integration Tests
on:
  push:
  pull_request:
jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Newman
        run: npm install -g newman

      - name: Build Solution
        run: dotnet build ShoppingMicroServicesApp.sln --configuration Release

      - name: Start Web APIs
        run: |
          dotnet run --project UsersWebAPI/UsersWebAPI.csproj &
          dotnet run --project OrdersWebAPI/OrdersWebAPI.csproj &
          dotnet run --project PaymentsWebAPI/PaymentsWebAPI.csproj &
          
          echo "Waiting for APIs..."
          timeout 60 bash -c 'until curl -sf http://localhost:5064/api/users > /dev/null 2>&1; do sleep 1; done'
          timeout 60 bash -c 'until curl -sf http://localhost:5074/api/payments > /dev/null 2>&1; do sleep 1; done'
          timeout 60 bash -c 'until curl -sf http://localhost:5121/api/orders > /dev/null 2>&1; do sleep 1; done'
          echo "All APIs ready!"

      - name: Run Newman Tests
        run: |
          newman run "postman/ECommerce Tests.postman_collection.json" \
          --environment "postman/ECommerce env.postman_environment.json" \
          --reporters cli,junit \
          --reporter-junit-export newman-report.xml
